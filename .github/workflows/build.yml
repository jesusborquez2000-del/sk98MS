name: Compilar APK Android

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compilar o empaquetar proyecto
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          elif command -v gradle &> /dev/null; then
            gradle assembleDebug
          else
            echo "Buscando archivos de compilación alternativos..."
          fi

      - name: Recolectar APKs
        run: |
          mkdir -p artifact_output
          find . -name "*.apk" -exec cp {} artifact_output/ \;

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: sk98MS-apk
          path: artifact_output/*.apk
