name: Compilar APK Android

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compilar con Gradle
        run: |
          gradle build || ./gradlew build || true

      - name: Buscar y copiar APKs generados
        run: |
          mkdir -p android-apk-output
          find . -name "*.apk" -exec cp {} android-apk-output/ \;

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: android-apk-output/*.apk
