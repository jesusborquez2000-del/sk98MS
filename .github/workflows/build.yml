name: Compilar APK Android

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Android SDK y compilar
        uses: android-actions/setup-android@v3

      - name: Compilar con Gradle Build Tool y generar Debug APK
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Ejecutar Gradle build directo
        run: gradle assembleDebug || ./gradlew assembleDebug || mvn clean package

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/app-debug.apk
